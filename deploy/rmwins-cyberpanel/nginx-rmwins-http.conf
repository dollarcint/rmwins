# Pre-certificate vhosts. They proxy over HTTP so every hostname can be tested
# before TLS is enabled. Replace this file with nginx-rmwins-https.conf only
# after a certificate covers rmwinsights.com, www.rmwinsights.com and
# api.rmwinsights.com.
map $request_method $rmwins_login_key {
    default "";
    POST $binary_remote_addr;
}
map $http_origin $rmwins_cors_origin {
    default "";
    "https://rmwinsights.com" $http_origin;
    "https://www.rmwinsights.com" $http_origin;
}
limit_req_zone $rmwins_login_key zone=rmwins_login:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name rmwinsights.com www.rmwinsights.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rmwins-acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }
}

server {
    listen 80;
    server_name api.rmwinsights.com;
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rmwins-acme;
        default_type text/plain;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=rmwins_login burst=10 nodelay;
        client_max_body_size 16k;
        error_page 413 = @rmwins_login_json_413;
        error_page 429 = @rmwins_login_json_429;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /login/ {
        limit_req zone=rmwins_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location = /admin/login/ {
        limit_req zone=rmwins_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location @rmwins_login_json_413 {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rmwins_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 413 '{"authenticated":false,"error":"The login request is too large."}';
    }

    location @rmwins_login_json_429 {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rmwins_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Retry-After "60" always;
        return 429 '{"authenticated":false,"error":"Too many login attempts. Please try again later."}';
    }

    location = /setup/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
