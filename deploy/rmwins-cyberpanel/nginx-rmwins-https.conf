# Production vhosts. This template expects one SAN certificate containing all
# three names at /etc/letsencrypt/live/rmwinsights.com/.
map $request_method $rmwins_login_key {
    default "";
    POST $binary_remote_addr;
}
map $http_origin $rmwins_cors_origin {
    default "";
    "https://rmwinsights.com" $http_origin;
    "https://www.rmwinsights.com" $http_origin;
}
limit_req_zone $rmwins_login_key zone=rmwins_login:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name rmwinsights.com www.rmwinsights.com api.rmwinsights.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rmwins-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rmwinsights.com;

    ssl_certificate /etc/letsencrypt/live/rmwinsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmwinsights.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RMWinsTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /imr_callback {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host api.rmwinsights.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host api.rmwinsights.com;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /gms_callback {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host api.rmwinsights.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host api.rmwinsights.com;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 301 https://www.rmwinsights.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.rmwinsights.com;

    ssl_certificate /etc/letsencrypt/live/rmwinsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmwinsights.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RMWinsTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /setup {
        return 302 https://api.rmwinsights.com/admin/;
    }

    location = /setup/ {
        return 302 https://api.rmwinsights.com/admin/;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }
}

server {
    listen 443 ssl http2;
    server_name api.rmwinsights.com;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/rmwinsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmwinsights.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RMWinsTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/auth/login/ {
        limit_req zone=rmwins_login burst=10 nodelay;
        client_max_body_size 16k;
        error_page 413 = @rmwins_login_json_413;
        error_page 429 = @rmwins_login_json_429;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /login/ {
        return 302 https://www.rmwinsights.com/login$is_args$args;
    }

    location = /admin/login/ {
        limit_req zone=rmwins_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location @rmwins_login_json_413 {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rmwins_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 413 '{"authenticated":false,"error":"The login request is too large."}';
    }

    location @rmwins_login_json_429 {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rmwins_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Retry-After "60" always;
        return 429 '{"authenticated":false,"error":"Too many login attempts. Please try again later."}';
    }

    location = /setup/ {
        return 302 /admin/;
    }

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
