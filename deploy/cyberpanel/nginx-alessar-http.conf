server {
    listen 80;
    server_name alessarsolutions.in www.alessarsolutions.in;

    location /.well-known/acme-challenge/ {
        root /var/www/alessar-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name api.alessarsolutions.in;

    location /.well-known/acme-challenge/ {
        root /var/www/alessar-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alessarsolutions.in www.alessarsolutions.in;

    ssl_certificate /etc/letsencrypt/live/alessarsolutions.in-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alessarsolutions.in-vps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlessarTLS:10m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.alessarsolutions.in;

    ssl_certificate /etc/letsencrypt/live/api.alessarsolutions.in-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alessarsolutions.in-vps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlessarTLS:10m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
