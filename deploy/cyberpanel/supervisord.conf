[unix_http_server]
file=%(ENV_HOME)s/tmp/alessar-supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_HOME)s/app_logs/alessar-supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=%(ENV_HOME)s/tmp/alessar-supervisord.pid
childlogdir=%(ENV_HOME)s/app_logs
nodaemon=false
minfds=2048

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/tmp/alessar-supervisor.sock

[program:alessar-redis]
directory=%(ENV_HOME)s/redis-data
command=/usr/bin/redis-server %(ENV_HOME)s/alessarsolutions/deploy/cyberpanel/redis-6381.conf
environment=HOME="%(ENV_HOME)s"
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/app_logs/alessar-redis.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:alessar-web]
directory=%(ENV_HOME)s/alessarsolutions/backend
command=%(ENV_HOME)s/alessarsolutions/backend/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8091 --workers 3 --threads 2 --timeout 120 --access-logfile %(ENV_HOME)s/app_logs/alessar-web-access.log --error-logfile %(ENV_HOME)s/app_logs/alessar-web-error.log
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/app_logs/alessar-web-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:alessar-worker]
directory=%(ENV_HOME)s/alessarsolutions/backend
command=%(ENV_HOME)s/alessarsolutions/backend/.venv/bin/celery -A config worker --loglevel=INFO --concurrency=4 --max-tasks-per-child=500
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/app_logs/alessar-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:alessar-beat]
directory=%(ENV_HOME)s/alessarsolutions/backend
command=%(ENV_HOME)s/alessarsolutions/backend/.venv/bin/celery -A config beat --loglevel=INFO --schedule=%(ENV_HOME)s/tmp/alessar-celerybeat-schedule --pidfile=%(ENV_HOME)s/tmp/alessar-celerybeat.pid
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
priority=40
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/app_logs/alessar-beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
