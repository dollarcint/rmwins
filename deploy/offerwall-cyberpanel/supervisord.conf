[unix_http_server]
file=/home/www.rmwinsights.com/app/offerwall/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=/home/www.rmwinsights.com/app/offerwall/run/supervisor/supervisord.pid
childlogdir=/home/www.rmwinsights.com/app/offerwall/logs/supervisor
nodaemon=true
minfds=2048
umask=0027

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/www.rmwinsights.com/app/offerwall/run/supervisor/supervisor.sock

[program:rmwins-offerwall-redis-persistent]
directory=/home/www.rmwinsights.com/app/offerwall/data/redis-persistent
command=/usr/bin/redis-server /home/www.rmwinsights.com/.config/rmwins-offerwall/redis-6384.conf
environment=HOME="/home/www.rmwinsights.com"
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/redis-persistent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:rmwins-offerwall-redis-cache]
directory=/home/www.rmwinsights.com/app/offerwall/data/redis-cache
command=/usr/bin/redis-server /home/www.rmwinsights.com/.config/rmwins-offerwall/redis-6385.conf
environment=HOME="/home/www.rmwinsights.com"
priority=11
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/redis-cache.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:rmwins-offerwall-web]
directory=/home/www.rmwinsights.com/offerwall/backend
command=/home/www.rmwinsights.com/offerwall/backend/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8095 --workers 3 --threads 2 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --worker-tmp-dir /dev/shm --access-logfile /home/www.rmwinsights.com/app/offerwall/logs/supervisor/web-access.log --error-logfile /home/www.rmwinsights.com/app/offerwall/logs/supervisor/web-error.log
environment=HOME="/home/www.rmwinsights.com",PYTHONUNBUFFERED="1"
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:rmwins-offerwall-worker]
directory=/home/www.rmwinsights.com/offerwall/backend
command=/home/www.rmwinsights.com/offerwall/backend/.venv/bin/celery -A config worker --loglevel=INFO --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=500
environment=HOME="/home/www.rmwinsights.com",PYTHONUNBUFFERED="1"
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:rmwins-offerwall-beat]
directory=/home/www.rmwinsights.com/offerwall/backend
command=/home/www.rmwinsights.com/offerwall/backend/.venv/bin/celery -A config beat --loglevel=INFO --schedule=/home/www.rmwinsights.com/app/offerwall/run/supervisor/celerybeat-schedule --pidfile=/home/www.rmwinsights.com/app/offerwall/run/supervisor/celerybeat.pid
environment=HOME="/home/www.rmwinsights.com",PYTHONUNBUFFERED="1"
priority=40
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/home/www.rmwinsights.com/app/offerwall/logs/supervisor/beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
