worker_processes 1;
pid /home/www.rmwinsights.com/app/offerwall/run/frontend/nginx.pid;
error_log /home/www.rmwinsights.com/app/offerwall/logs/frontend/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/www.rmwinsights.com/app/offerwall/logs/frontend/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    client_body_temp_path /home/www.rmwinsights.com/app/offerwall/tmp/frontend/client_body;
    proxy_temp_path /home/www.rmwinsights.com/app/offerwall/tmp/frontend/proxy;
    fastcgi_temp_path /home/www.rmwinsights.com/app/offerwall/tmp/frontend/fastcgi;
    uwsgi_temp_path /home/www.rmwinsights.com/app/offerwall/tmp/frontend/uwsgi;
    scgi_temp_path /home/www.rmwinsights.com/app/offerwall/tmp/frontend/scgi;

    server {
        listen 127.0.0.1:8096;
        server_name _;
        # Keep the app release separate from CyberPanel's existing public_html
        # until the public reverse-proxy cutover has passed health checks.
        root /home/www.rmwinsights.com/app/offerwall/frontend-dist;
        index index.html;

        location = /__health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
