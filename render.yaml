databases:
  - name: alessar-postgres
    databaseName: alessar
    user: alessar
    plan: free

services:
  - type: web
    name: alessar-survey-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: api.alessarsolutions.in,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://api.alessarsolutions.in
      - key: INNOVATEMR_ACCESS_TOKEN
        sync: false
      - key: VOQALL_ACCESS_KEY
        sync: false
      - key: SURVEY_TRACKED_FLOW_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: alessar-postgres
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: bunnygupta578@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: alessar-solutions
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_DASHBOARD_LOGIN_URL
        value: https://api.alessarsolutions.in/login/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
