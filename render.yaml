databases:
  - name: alessar-postgres
    databaseName: alessar
    user: alessar
    plan: free

services:
  - type: web
    name: alessar-survey-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_HTTPS_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: api.alessarsolutions.in,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://api.alessarsolutions.in,https://alessarsolutions.in,https://www.alessarsolutions.in,https://alessar-solutions.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://alessarsolutions.in,https://www.alessarsolutions.in,https://alessar-solutions.onrender.com
      - key: INNOVATEMR_ACCESS_TOKEN
        sync: false
      - key: VOQALL_ACCESS_KEY
        sync: false
      - key: SURVEY_TRACKED_FLOW_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: alessar-postgres
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: bunnygupta578@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: alessar-solutions
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_DASHBOARD_URL
        value: https://api.alessarsolutions.in
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
