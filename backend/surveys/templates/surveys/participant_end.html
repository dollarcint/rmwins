{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ result.title }} - Alessar Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'surveys/css/participant.css' %}">
</head>
<body class="result-page result-{{ result.tone }}">
  <header class="participant-header">
    <a class="participant-brand" href="https://alessarsolutions.in/">
      <span class="brand-dot" aria-hidden="true"></span>
      <span><strong>Alessar Solutions</strong><small>Research Cloud</small></span>
    </a>
  </header>
  <main class="result-shell">
    <section class="result-card">
      <div class="result-icon" aria-hidden="true">{{ result.icon }}</div>
      <p class="eyebrow">Survey status</p>
      <h1>{{ result.title }}</h1>
      <p>{{ result.message }}</p>
      {% if session %}<div class="reference-row"><span>Reference</span><strong>{{ session.public_id }}</strong></div>{% endif %}
      <a class="home-button" href="https://alessarsolutions.in/">Return to Alessar Solutions</a>
    </section>
  </main>
</body>
</html>
